# Netlify configuration for Vite + React SPA
[build]
  command = "npm run build"
  publish = "dist"
  # If your repo root is ABOVE this folder (monorepo), uncomment next line:
  # base = "Tesis-Front"

[build.environment]
  # Pin Node version to avoid mismatches
  NODE_VERSION = "20"

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
